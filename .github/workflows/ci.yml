name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked --verbose

      - name: Tests
        run: cargo test --locked --verbose

      # Clippy en information : n'échoue pas encore sur les warnings existants.
      # Objectif à terme : passer en `-D warnings` une fois le nettoyage P1 fait.
      - name: Clippy (informational)
        run: cargo clippy --all-targets
