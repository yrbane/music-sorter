[package]
name = "music-sorter"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
dirs = "6"
lofty = "0.22"
rayon = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json", "gzip", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
reflink-copy = "0.1"

[dev-dependencies]
tempfile = "3"
